<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Вход — knit.katarina</title>
  <meta name="theme-color" content="#c47a52" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <a class="logo" href="home.html">knit.katarina</a>
    <nav class="nav" aria-label="Основная навигация">
      <a href="catalog.html">Каталог</a>
      <a href="about.html">О мастерской</a>
      <a href="custom-order.html">На заказ</a>
      <a href="delivery.html">Доставка</a>
      <a href="contacts.html">Контакты</a>
    </nav>
    <div class="header-actions">
      <a href="favorites.html" aria-label="Избранное">♡</a>
      <a href="cart.html" aria-label="Корзина">Корзина</a>
      <a class="header-account" href="account.html">Кабинет</a>
    </div>
  </header>

  <main class="page narrow">
    <div class="page-head">
      <h1>Вход</h1>
      <p>Для заказов, избранного и истории покупок.</p>
    </div>

    <form class="panel-form" id="login-form">
      <label class="field">
        <span>Email</span>
        <input type="email" name="email" required />
      </label>
      <label class="field">
        <span>Пароль</span>
        <input type="password" name="password" required />
      </label>
      <button type="submit" class="btn btn-primary">Войти</button>
      <p class="form-status error" id="login-error" hidden></p>
      <p class="page-note">Нет аккаунта? <a class="text-link" href="register.html">Зарегистрироваться на сайте</a></p>
    </form>
  </main>

  <footer class="site-footer">
    <p class="footer-brand">knit.katarina</p>
    <div class="footer-links">
      <a href="catalog.html">Каталог</a>
      <a href="delivery.html">Доставка и оплата</a>
      <a href="contacts.html">Контакты</a>
      <a href="login.html">Войти</a>
    </div>
    <p class="footer-copy">© knit.katarina — изделия ручной работы</p>
  </footer>

  <script src="js/store.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
