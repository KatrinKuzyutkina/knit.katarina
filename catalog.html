<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Каталог — knit.katarina</title>
  <meta name="description" content="Каталог уникальных изделий ручной работы: фильтр по категории, цвету и цене." />
  <meta name="theme-color" content="#c47a52" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <a class="logo" href="home.html">knit.katarina</a>
    <nav class="nav" aria-label="Основная навигация">
      <a href="catalog.html" aria-current="page">Каталог</a>
      <a href="about.html">О мастерской</a>
      <a href="custom-order.html">На заказ</a>
      <a href="delivery.html">Доставка</a>
      <a href="contacts.html">Контакты</a>
    </nav>
    <div class="header-actions">
      <a href="favorites.html" aria-label="Избранное">♡</a>
      <a href="cart.html" aria-label="Корзина">Корзина</a>
      <a class="header-account" href="account.html">Кабинет</a>
    </div>
  </header>

  <main class="catalog-page">
    <div class="catalog-head">
      <h1>Каталог</h1>
      <p>Каждое изделие — в единственном экземпляре.</p>
    </div>

    <form class="catalog-filters" id="catalog-filters" aria-label="Фильтры каталога">
      <label class="filter-field">
        <span>Категория</span>
        <select name="category" id="filter-category">
          <option value="all">Все</option>
          <option value="интерьер">Интерьер</option>
          <option value="подарки">Подарки</option>
          <option value="аксессуары">Аксессуары</option>
        </select>
      </label>

      <label class="filter-field">
        <span>Цвет</span>
        <select name="color" id="filter-color">
          <option value="all">Все</option>
          <option value="терракот">Терракот</option>
          <option value="бежевый">Бежевый</option>
          <option value="кремовый">Кремовый</option>
          <option value="серый">Серый</option>
          <option value="пыльная роза">Пыльная роза</option>
        </select>
      </label>

      <label class="filter-field">
        <span>Сортировка</span>
        <select name="sort" id="filter-sort">
          <option value="default">По умолчанию</option>
          <option value="price-asc">Цена: по возрастанию</option>
          <option value="price-desc">Цена: по убыванию</option>
        </select>
      </label>

      <p class="catalog-count" id="catalog-count" aria-live="polite"></p>
    </form>

    <div class="product-grid" id="product-grid"></div>

    <p class="catalog-empty" id="catalog-empty" hidden>
      По выбранным фильтрам ничего не найдено.
      <a class="text-link" href="custom-order.html">Заказать изделие →</a>
    </p>
  </main>

  <footer class="site-footer">
    <p class="footer-brand">knit.katarina</p>
    <div class="footer-links">
      <a href="catalog.html">Каталог</a>
      <a href="delivery.html">Доставка и оплата</a>
      <a href="contacts.html">Контакты</a>
      <a href="login.html">Войти</a>
    </div>
    <p class="footer-copy">© knit.katarina — изделия ручной работы</p>
  </footer>

  <script src="js/store.js"></script>
  <script src="js/main.js"></script>
  <script src="js/catalog.js"></script>
</body>
</html>
